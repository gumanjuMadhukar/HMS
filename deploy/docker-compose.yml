# ============================================
# HMS - Docker Compose (Production)
# Usage:
#   docker compose -f deploy/docker-compose.yml up -d --build
# ============================================

services:
  app:
    build:
      context: ../back
      dockerfile: ../deploy/docker/Dockerfile.app
    image: hms_app:latest
    container_name: hms_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - app-storage:/var/www/storage
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - hms-network

  db:
    image: postgres:15
    container_name: hms_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hostel_saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - hms-db-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - hms-network

  nginx:
    image: nginx:alpine
    container_name: hms_nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - app-storage:/var/www/public
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - hms-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: hms_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - hms-network

networks:
  hms-network:
    name: hms-network

volumes:
  hms-db-data:
  app-storage:
